[package]
name = "cooking-rs"
version = "0.1.0"
edition = "2021"
description = "A static Leptos webapp for visualizing recipes and building a weekly meal plan"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
base64 = "0.22"
console_error_panic_hook = "0.1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Location",
    "Navigator",
    "Clipboard",
    "Document",
    "Element",
    "Node",
    "HtmlHeadElement",
    "ServiceWorkerContainer",
    "Storage",
    "History",
    "HtmlElement",
    "PointerEvent",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
