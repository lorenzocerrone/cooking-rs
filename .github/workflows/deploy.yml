name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The live site is published to the root of the `gh-pages` branch, which
# GitHub Pages serves (Settings → Pages → Source: Deploy from a branch →
# gh-pages, / (root)). Pull-request previews live beside it in pr-preview/
# (see preview.yml) and are left untouched here.
permissions:
  contents: write

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xzf - -C /usr/local/bin

      # The repo is served at https://<user>.github.io/cooking-rs/, so both the
      # asset base (--public-url) and the router base (APP_BASE_PATH) must point
      # at /cooking-rs. Change these together if you rename the repo or use a
      # user/root or custom-domain page (then both become "/" and "" respectively).
      - name: Build
        env:
          APP_BASE_PATH: /cooking-rs
        run: trunk build --release --public-url /cooking-rs/

      # SPA fallback: GitHub Pages serves 404.html for unknown paths, so a hard
      # refresh of /cooking-rs/planner loads the app instead of a 404 (and a deep
      # link into a PR preview goes back to that preview).
      - name: Add SPA fallback
        run: python3 .github/scripts/spa_fallback.py dist

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
