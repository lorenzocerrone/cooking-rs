name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The live site (now a redirect to menu.lock) is published to the root of the
# `gh-pages` branch, which GitHub Pages serves. Pull-request previews live
# beside it in pr-preview/ (see preview.yml) and are left untouched here.
permissions:
  contents: write

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cooking-rs moved to menu.lock (https://github.com/lorenzocerrone/menu-lock).
      # The site is now a redirect: every old address, with its plan, goes to the
      # same page of the new app, and a small service worker removes the old
      # app's worker from phones that installed it. See redirect/.
      - name: Check the redirect's address mapping
        run: node redirect/test.mjs

      # GitHub Pages serves 404.html for unknown paths, so deep links
      # (/cooking-rs/planner) redirect too.
      - name: Assemble the site
        run: |
          mkdir dist
          cp redirect/index.html dist/index.html
          cp redirect/index.html dist/404.html
          cp redirect/sw.js dist/sw.js

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
